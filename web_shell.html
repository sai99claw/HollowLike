<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="description" content="一隻鴿子，從鳥巢開始的塔式動作冒險。無雙與 Roguelike 雙模式原型。">
<title>枝間鴿行 Pigeon Tower</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#0b1415;overflow:hidden;font-family:system-ui,"Microsoft JhengHei",sans-serif;color:#f5edd6}#canvas{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);display:block;width:min(100vw,177.777778dvh);height:auto;aspect-ratio:16/9;outline:0;touch-action:none}html[data-game-fit="cover"] #canvas{width:calc(max(100vw,177.777778dvh)*var(--game-zoom,1))}#loading{position:fixed;inset:0;display:grid;place-content:center;text-align:center;background:radial-gradient(ellipse at 50% 25%,#416a54,#173c35 65%);z-index:10;padding:24px}#loading svg{margin:auto;width:100px;height:100px;animation:float 2.4s ease-in-out infinite}h1{font-weight:600;font-size:36px;letter-spacing:7px;margin:20px 0 8px}.eyebrow{font-size:11px;letter-spacing:4px;color:#a9c8b5}.detail{font-size:14px;color:#b8d1bf;line-height:1.9;margin-top:22px}progress{appearance:none;width:260px;height:4px;border:0;margin:24px auto 8px;border-radius:6px;overflow:hidden;background:#78917c}progress::-webkit-progress-bar{background:#56705c}progress::-webkit-progress-value{background:#e9cc92}.error{color:#ffd0b6;max-width:580px;overflow-wrap:anywhere}button{border:1px solid #98b39b;background:#f5e6c7;color:#173b36;border-radius:8px;padding:12px 20px;margin:20px auto;cursor:pointer;box-shadow:0 4px 0 #203b36}button:hover{outline:2px solid #f7d48e;outline-offset:2px}button:active{transform:translateY(3px);box-shadow:0 1px 0 #203b36}@keyframes float{50%{transform:translateY(-9px)}}
</style>
$GODOT_HEAD_INCLUDE
</head>
<body>
<canvas id="canvas" width="1280" height="720" tabindex="0" aria-label="枝間鴿行遊戲畫面">此遊戲需要支援 WebGL 2 的瀏覽器。</canvas>
<div id="loading">
<svg viewBox="0 0 100 100" aria-hidden="true"><ellipse cx="49" cy="85" rx="31" ry="5" fill="#102f2b" opacity=".4"/><path d="M18 58Q16 78 52 78Q82 72 75 47Q70 22 54 25Q37 25 40 44Q21 40 18 58" fill="#d8dfe0"/><path d="M26 53Q50 43 64 65Q48 80 28 67Z" fill="#829698"/><path d="M45 47Q58 55 70 44" stroke="#85baaa" stroke-width="7" fill="none"/><circle cx="61" cy="34" r="3" fill="#243d3c"/><path d="M73 36L88 41L73 45Z" fill="#e8b579"/><path d="M43 78L40 86M61 78L65 86" stroke="#dca479" stroke-width="3" stroke-linecap="round"/></svg>
<div class="eyebrow">PIGEON TOWER · v0.81</div><h1>枝間鴿行</h1>
<div>從一個鳥巢，走進會生長的世界。</div>
<progress id="progress"></progress><div class="detail" id="status">正在準備羽翼，首次載入需要片刻…</div>
</div>
<script>
// Split both the engine and game pack into static assets below hosting limits.
// The native Godot source project is unchanged by this web transport layer.
const originalFetch=window.fetch.bind(window);
window.fetch=async function(input,options){
 const url=new URL(input instanceof Request?input.url:String(input),location.href);
 const isWasm=url.pathname.endsWith('/index.wasm');
 if(isWasm||url.pathname.endsWith('/index.pck')){
  const manifestResponse=await originalFetch(new URL(isWasm?'wasm-parts.json':'pck-parts.json',url));
  if(!manifestResponse.ok)return originalFetch(input,options);
  const manifest=await manifestResponse.json();let loaded=0;
  const buffers=await Promise.all(manifest.parts.map(async name=>{
   const r=await originalFetch(new URL(name,url));if(!r.ok)throw Error('遊戲載入失敗，請重新整理');
   const b=new Uint8Array(await r.arrayBuffer());loaded+=b.length;
   document.getElementById('status').textContent=(isWasm?'正在準備羽翼 ':'正在載入場景與音樂 ')+Math.round(loaded/manifest.size*100)+'%';return b;
  }));
  const bytes=new Uint8Array(manifest.size);let offset=0;
  for(const b of buffers){bytes.set(b,offset);offset+=b.length;}
  const packed=manifest.encoding==='gzip';
  const body=packed?new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip')):bytes;
  return new Response(body,{headers:{'Content-Type':isWasm?'application/wasm':'application/octet-stream','Content-Length':String(packed?manifest.decoded_size:bytes.length)}});
 }
 return originalFetch(input,options);
};
</script>
<script src="web_touch_v29.js"></script>
<script src="web_feedback_v30.js"></script>
<script src="web_performance_v42.js"></script>
<script src="$GODOT_URL"></script>
<script>
const config=$GODOT_CONFIG;
const engine=new Engine(config);
const missing=Engine.getMissingFeatures({threads:$GODOT_THREADS_ENABLED});
const status=document.getElementById('status'),progress=document.getElementById('progress');
function failure(err){status.className='detail error';status.textContent=String(err.message||err);const b=document.createElement('button');b.textContent='重新載入';b.onclick=()=>location.reload();status.appendChild(b);console.error(err);}
if(missing.length)failure('此瀏覽器缺少 '+missing.join(', ')+'，請使用支援 WebGL 2 的瀏覽器。');
else engine.startGame({canvas:document.getElementById('canvas'),onProgress(current,total){if(total){progress.value=current;progress.max=total;}}}).then(()=>{document.getElementById('loading').remove();document.getElementById('canvas').focus();},failure);
</script>
</body></html>
